services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      PROJECT_ROOT: /app
    ports: ["8000:8000"]
    volumes: ["./data:/app/data:ro", "./evaluation:/app/evaluation"]
    depends_on: [qdrant]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes: {qdrant_data: {}}
